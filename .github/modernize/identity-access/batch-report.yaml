      change_type: created
      description: Exports the mail adapter for onboarding modules.
    - file: 'src/infrastructure/mail/mail.service.spec.ts'
      change_type: created
      description: Tests isolated test delivery, missing SMTP configuration, and header injection rejection.
    - file: 'src/app.module.ts'
      change_type: modified
      description: Validates optional SMTP environment settings and registers MailModule.
    - file: '.env.example'
      change_type: modified
      description: Documents blank-by-default SMTP settings.
  T007:
    - file: 'src/common/auth/auth-context.ts'
      change_type: created
      description: Defines the shared authenticated user and trusted ownership scope.
    - file: 'src/common/auth/roles.decorator.ts'
      change_type: created
      description: Defines typed role metadata for protected routes.
    - file: 'src/common/auth/roles.guard.ts'
      change_type: created
      description: Enforces required roles and denies missing authenticated context.
    - file: 'src/common/auth/ownership.ts'
      change_type: created
      description: Checks explicitly selected user, provider, or institution ownership and denies missing IDs.
    - file: 'src/common/auth/roles.guard.spec.ts'
      change_type: created
      description: Covers missing context, incorrect roles, matching roles, unannotated routes, and empty role metadata.
    - file: 'src/common/auth/ownership.spec.ts'
      change_type: created
      description: Covers matching and absent or mismatched ownership scopes.
    - file: 'src/modules/auth/auth.guard.ts'
      change_type: modified
      description: Adds trusted provider and institution scope IDs to the authenticated request context.
    - file: 'src/modules/auth/auth.guard.spec.ts'
      change_type: modified
      description: Verifies the authenticated context includes database-derived ownership scopes.
    - file: 'src/modules/auth/auth.module.ts'
      change_type: modified
      description: Registers the shared role guard globally.
    - file: 'src/modules/auth/auth.service.ts'
      change_type: modified
      description: Uses the shared authenticated-user type from src/common/auth.
    - file: 'src/modules/auth/auth.controller.ts'
      change_type: modified
      description: Uses the shared authenticated-request type from src/common/auth.
    - file: 'src/modules/auth/auth.types.ts'
      change_type: deleted
      description: Moves shared authenticated request types into src/common/auth/auth-context.ts.
    - file: '.github/modernize/assessment/engines/facts/api-service-contracts.md'
      change_type: modified
      description: Distinguishes available authorization helpers from route-level policies still pending.
    - file: 'README.md'
      change_type: modified
      description: Documents available SMTP and authorization infrastructure without claiming unimplemented routes.
    - file: 'docs/estado-y-siguientes-pasos.md'
      change_type: modified
      description: Updates implementation status and links the backend handoff.
  T008:
    - file: 'src/infrastructure/security/trusted-proxy-cidr.ts'
      change_type: created
      description: Validates explicit proxy IP/CIDR entries and rejects overly broad ranges.
    - file: 'src/infrastructure/security/trusted-proxy-cidr.spec.ts'
      change_type: created
      description: Tests valid and invalid proxy ranges.
    - file: 'test/auth.e2e-spec.ts'
      change_type: created
      description: Tests cookie flags, CSRF enforcement, and login throttling despite spoofed forwarded headers.
  T009:
    - file: 'src/modules/auth/auth.service.ts'
      change_type: created
      description: Verifies Argon2id credentials with generic failure behavior.
  T010:
    - file: 'src/modules/auth/auth.service.ts'
      change_type: modified
      description: Creates hashed opaque sessions with expiry and supports revocation.
    - file: 'src/modules/auth/auth.types.ts'
      change_type: created
      description: Defines the safe authenticated-user context attached to requests.
  T011:
    - file: 'src/modules/auth/auth.guard.ts'
      change_type: created
      description: Requires valid sessions and session-bound CSRF tokens for writes.
    - file: 'src/modules/auth/auth.service.ts'
      change_type: modified
      description: Issues and rotates CSRF tokens while storing only their hash.
  T012:
    - file: 'src/modules/auth/auth.controller.ts'
      change_type: created
      description: Implements sign-in, current-user, CSRF, and logout endpoints.
    - file: 'src/modules/auth/sign-in.dto.ts'
      change_type: created
      description: Validates and normalizes sign-in email input.
    - file: 'src/modules/auth/auth.module.ts'
      change_type: modified
      description: Registers authentication routes and the global session guard.
    - file: 'src/modules/auth/public.decorator.ts'
      change_type: created
      description: Marks the health and sign-in handlers as public.
    - file: 'src/modules/health/health.controller.ts'
      change_type: modified
      description: Keeps health endpoint explicitly public.
    - file: '.github/modernize/assessment/engines/facts/api-service-contracts.md'
      change_type: modified
      description: Publishes current route and session contracts.
  T013:
    - file: 'src/modules/auth/auth.service.spec.ts'
      change_type: modified
      description: Covers valid, invalid, and ineligible account sign-in.
    - file: 'src/modules/auth/auth.guard.spec.ts'
      change_type: created
      description: Covers missing, expired, revoked sessions and CSRF rejection.
    - file: 'src/modules/auth/auth.controller.spec.ts'
      change_type: created
      description: Covers Secure cookie behavior for production and SameSite=None.
    - file: 'test/auth.e2e-spec.ts'
      change_type: created
      description: Covers the HTTP session lifecycle and rate limiting.
  T006:
    - artifact: '.github/modernize/identity-access/spec.md#REQ-014'
      used_for: 'Configurable SMTP delivery without hardcoding the provider.'
  T007:
    - artifact: '.github/modernize/identity-access/spec.md#REQ-008'
      used_for: 'Shared role enforcement and resource-owner checks for future protected operations.'
