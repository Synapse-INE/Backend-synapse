    - file: 'src/app.module.ts'
      change_type: modified
      description: Validates session, cookie, and proxy configuration.
    - file: 'src/main.ts'
      change_type: modified
      description: Enables credentialed CORS, cookie parsing, and explicit proxy CIDRs.
    - file: 'package.json'
      change_type: modified
      description: Includes Argon2id, cookie-parser, mail, and PGlite development dependencies.
  T006:
    - file: 'src/infrastructure/mail/mail.service.ts'
      change_type: created
      description: Provides configurable SMTP delivery, explicit missing-configuration errors, and a JSON-only test transport.
