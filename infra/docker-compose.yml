services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-precios_referencia}
      POSTGRES_USER: ${POSTGRES_USER:-precios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    image: synapse-api
    build:
      context: ..
      dockerfile: Dockerfile
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-precios}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-precios_referencia}
    depends_on:
      database:
        condition: service_healthy

  demo-seed:
    image: synapse-api
    profiles: ['evaluation']
    command: ['node', 'dist/scripts/seed-demo.js']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-precios}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-precios_referencia}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      DEMO_SEED_ENVIRONMENT: ${DEMO_SEED_ENVIRONMENT:-}
      DEMO_SEED_DATABASE_NAME: ${DEMO_SEED_DATABASE_NAME:-}
      DEMO_SEED_CONFIRMATION: ${DEMO_SEED_CONFIRMATION:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_JEFE_PASSWORD: ${DEMO_JEFE_PASSWORD:-}
      DEMO_TRABAJADOR_INE_PASSWORD: ${DEMO_TRABAJADOR_INE_PASSWORD:-}
      DEMO_PROVEEDOR_PASSWORD: ${DEMO_PROVEEDOR_PASSWORD:-}
      DEMO_SOLICITANTE_PASSWORD: ${DEMO_SOLICITANTE_PASSWORD:-}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    image: synapse-api
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-precios}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-precios_referencia}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ine_session}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      EMAIL_TOKEN_TTL_HOURS: ${EMAIL_TOKEN_TTL_HOURS:-24}
      RESET_TOKEN_TTL_HOURS: ${RESET_TOKEN_TTL_HOURS:-1}
      INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS:-72}
      REGISTRO_DOMINIOS_PERMITIDOS: ${REGISTRO_DOMINIOS_PERMITIDOS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      IMPORT_INE_MAX_FILE_BYTES: ${IMPORT_INE_MAX_FILE_BYTES:-52428800}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - adjuntos_data:/var/lib/synapse/adjuntos
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  adjuntos_data:
